[package]
name = "briij-cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
rust-version.workspace = true

[package.metadata.release]
release = false

[[bin]]
name = "briij-cli"
path = "src/main.rs"
test = false

[dependencies]
clap = { workspace = true, features = ["derive"] }
qr2term = "0.3.3"
qrcode = "0.14.1"
urlencoding = "2.1.3"
xrpl-mithril = { version = "0.5.3", features = ["native-crypto"] }

[lints]
workspace = true
