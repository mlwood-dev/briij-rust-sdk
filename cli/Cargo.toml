[package]
name = "briij-cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
rust-version.workspace = true

[package.metadata.release]
release = false

[[bin]]
name = "briij-cli"
path = "src/main.rs"
test = false

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
reqwest = { workspace = true, features = ["json", "query", "rustls"] }
qr2term = "0.3.3"
qrcode = "0.14.1"
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url.workspace = true
urlencoding = "2.1.3"
xrpl-mithril = { version = "0.5.3", features = ["native-crypto"] }

[lints]
workspace = true
